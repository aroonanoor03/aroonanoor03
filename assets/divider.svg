<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A9C0A0" stop-opacity="0"/>
      <stop offset="15%" stop-color="#A9C0A0"/>
      <stop offset="50%" stop-color="#E8C9D5"/>
      <stop offset="85%" stop-color="#C98BA5"/>
      <stop offset="100%" stop-color="#C98BA5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#lineGrad)" stroke-width="2"/>

  <g transform="translate(600,30)">
    <circle r="7" fill="#C98BA5"/>
    <g>
      <path d="M 0 0 Q -22 -16 -40 -2 Q -22 6 0 0" fill="#A9C0A0">
        <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 0 Q 22 -16 40 -2 Q 22 6 0 0" fill="#A9C0A0">
        <animateTransform attributeName="transform" type="rotate" values="6;-6;6" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <g transform="translate(300,30)" opacity="0.8">
    <circle r="4" fill="#E8C9D5">
      <animate attributeName="cy" values="0;-4;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(900,30)" opacity="0.8">
    <circle r="4" fill="#6B8E5A">
      <animate attributeName="cy" values="0;-4;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
