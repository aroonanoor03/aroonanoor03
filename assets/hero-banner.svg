<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9C0A0"/>
      <stop offset="45%" stop-color="#CFE0C6"/>
      <stop offset="70%" stop-color="#E8C9D5"/>
      <stop offset="100%" stop-color="#C98BA5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <circle cx="140" cy="280" r="130" fill="#FFFFFF" opacity="0.10" filter="url(#softBlur)"/>
  <circle cx="1080" cy="60" r="150" fill="#FFFFFF" opacity="0.12" filter="url(#softBlur)"/>
  <circle cx="950" cy="290" r="90" fill="#6B8E5A" opacity="0.10" filter="url(#softBlur)"/>

  <g opacity="0.9">
    <path d="M 0 250 Q 300 210 600 250 T 1200 250" fill="none" stroke="#F7F3EC" stroke-width="2" opacity="0.35"/>
    <path d="M 0 270 Q 300 235 600 270 T 1200 270" fill="none" stroke="#F7F3EC" stroke-width="2" opacity="0.25"/>
  </g>

  <g>
    <ellipse rx="9" ry="5.5" fill="#F7F3EC" opacity="0.9">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 80,300 C 200,120 380,260 620,60" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="7" ry="4.5" fill="#E8C9D5" opacity="0.9">
      <animateMotion dur="11s" begin="1.5s" repeatCount="indefinite" path="M 200,320 C 350,140 520,250 760,40" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="11s" begin="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="8" ry="5" fill="#FFFFFF" opacity="0.85">
      <animateMotion dur="10s" begin="3s" repeatCount="indefinite" path="M 420,310 C 560,150 700,260 940,50" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.85;1" dur="10s" begin="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="6" ry="4" fill="#6B8E5A" opacity="0.7">
      <animateMotion dur="12s" begin="5s" repeatCount="indefinite" path="M 640,320 C 780,160 900,270 1120,60" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.85;1" dur="12s" begin="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="8" ry="5" fill="#F7F3EC" opacity="0.85">
      <animateMotion dur="8.5s" begin="2s" repeatCount="indefinite" path="M 900,300 C 1000,140 1080,240 1160,50" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.85;1" dur="8.5s" begin="2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <text x="600" y="147" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#2E3A28" stroke="#F7F3EC" stroke-width="0.6">
    Aroona Noor
  </text>
  <text x="600" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#3E4A35">
    Aroona Noor
  </text>

  <line x1="430" y1="172" x2="770" y2="172" stroke="#3E4A35" stroke-width="1.5" opacity="0.5"/>

  <text x="600" y="210" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="22" letter-spacing="0.5" fill="#3E4A35" opacity="0.9">
    AI Engineer &#8226; Software Engineer &#8226; Full-Stack Developer
  </text>

  <text x="600" y="245" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="15" letter-spacing="2" fill="#3E4A35" opacity="0.65">
    COMPUTER VISION &#160;&#183;&#160; NLP &amp; LLMS &#160;&#183;&#160; PRODUCT ENGINEERING
  </text>
</svg>
