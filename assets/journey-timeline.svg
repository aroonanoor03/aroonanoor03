<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A9C0A0"/>
      <stop offset="50%" stop-color="#E8C9D5"/>
      <stop offset="100%" stop-color="#C98BA5"/>
    </linearGradient>
    <filter id="tShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#3E4A35" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="600" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3E4A35">
    Journey So Far
  </text>

  <path d="M100,150 C212,90 212,150 325,120 C437,90 437,210 550,180 C662,150 662,90 775,120 C887,150 887,150 1000,150"
        fill="none" stroke="url(#pathGrad)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" from="0,1400" to="1400,0" dur="2.2s" fill="freeze"/>
  </path>

  <g font-family="'Trebuchet MS', Verdana, sans-serif" text-anchor="middle" filter="url(#tShadow)">

    <g opacity="0">
      <circle cx="100" cy="150" r="7" fill="#6B8E5A"/>
      <text x="100" y="118" font-size="12.5" fill="#3E4A35" font-weight="600">
        <tspan x="100" dy="0">Began BS CS</tspan>
        <tspan x="100" dy="14">AI Specialization</tspan>
      </text>
      <text x="100" y="186" font-size="12" fill="#3E4A35" opacity="0.85">
        <tspan x="100" dy="0">Recipe Recognition</tspan>
        <tspan x="100" dy="14">CNN Pipeline</tspan>
      </text>
      <text x="100" y="230" font-size="14" font-weight="700" fill="#C98BA5">2023</text>
      <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.5s" fill="freeze"/>
    </g>

    <g opacity="0">
      <circle cx="325" cy="120" r="7" fill="#C98BA5"/>
      <text x="325" y="88" font-size="12.5" fill="#3E4A35" font-weight="600">
        <tspan x="325" dy="0">Traffic Light CV</tspan>
        <tspan x="325" dy="14">System Shipped</tspan>
      </text>
      <text x="325" y="156" font-size="12" fill="#3E4A35" opacity="0.85">
        <tspan x="325" dy="0">Became Teaching</tspan>
        <tspan x="325" dy="14">Assistant, DSA</tspan>
      </text>
      <text x="325" y="200" font-size="14" font-weight="700" fill="#C98BA5">2024</text>
      <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.5s" fill="freeze"/>
    </g>

    <g opacity="0">
      <circle cx="550" cy="180" r="7" fill="#6B8E5A"/>
      <text x="550" y="148" font-size="12.5" fill="#3E4A35" font-weight="600">
        <tspan x="550" dy="0">Edge AI Split-</tspan>
        <tspan x="550" dy="14">Inference System</tspan>
      </text>
      <text x="550" y="216" font-size="12" fill="#3E4A35" opacity="0.85">
        <tspan x="550" dy="0">Rent Marketplace</tspan>
        <tspan x="550" dy="14">Full-Stack Platform</tspan>
      </text>
      <text x="550" y="260" font-size="14" font-weight="700" fill="#C98BA5">2025</text>
      <animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.5s" fill="freeze"/>
    </g>

    <g opacity="0">
      <circle cx="775" cy="120" r="7" fill="#C98BA5"/>
      <text x="775" y="88" font-size="12.5" fill="#3E4A35" font-weight="600">
        <tspan x="775" dy="0">3rd Place — National</tspan>
        <tspan x="775" dy="14">Idea Competition</tspan>
      </text>
      <text x="775" y="200" font-size="14" font-weight="700" fill="#C98BA5">2026</text>
      <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.5s" fill="freeze"/>
    </g>

    <g opacity="0">
      <circle cx="1000" cy="150" r="7" fill="#6B8E5A"/>
      <text x="1000" y="118" font-size="12.5" fill="#3E4A35" font-weight="600">
        <tspan x="1000" dy="0">Expected</tspan>
        <tspan x="1000" dy="14">Graduation</tspan>
      </text>
      <text x="1000" y="200" font-size="14" font-weight="700" fill="#C98BA5">2027</text>
      <animate attributeName="opacity" values="0;1" begin="2.5s" dur="0.5s" fill="freeze"/>
    </g>

  </g>

  <g fill="#C98BA5">
    <circle cx="100" cy="150" r="3.5">
      <animate attributeName="r" values="3.5;7;3.5" begin="0.6s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" begin="0.6s" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="325" cy="120" r="3.5">
      <animate attributeName="r" values="3.5;7;3.5" begin="1.2s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" begin="1.2s" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="180" r="3.5">
      <animate attributeName="r" values="3.5;7;3.5" begin="1.8s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" begin="1.8s" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="775" cy="120" r="3.5">
      <animate attributeName="r" values="3.5;7;3.5" begin="2.4s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" begin="2.4s" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="150" r="3.5">
      <animate attributeName="r" values="3.5;7;3.5" begin="3.0s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" begin="3.0s" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
